baseURL = "https://go-pdfkit.github.io/"
title = "go-pdfkit"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# The architectures the whole test suite RUNS on -- not the ones it compiles
# for. amd64 and arm64 come from the ubuntu, windows and macOS runners; the
# other six from the arch job, five under qemu and 386 natively. Listed here
# so the page renders both the names and the count from one place: a count
# typed beside the names it counts is right the day it is typed.
#
# ⛔ Cross-compilation is NOT membership of this list. js/wasm, darwin and
# windows are built and not run on every push, and saying "runs on" of a
# target nothing executed is the claim this fleet exists to avoid making.
[params]
  arches = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x", "386", "arm"]

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"

[[params.repos]]
  name = "reader"
  pkg = "github.com/go-pdfkit/reader"
  url = "https://github.com/go-pdfkit/reader"
  status = "ready"
  blurb = "**Reads and writes the format itself.** Lexer and object model, cross-reference tables *and* streams with hybrid files and `/Prev` chains, object streams, repair by scanning when the table is wrong, every filter (Flate, LZW with early change, ASCIIHex, ASCII85, RunLength, PNG and TIFF predictors), the standard security handler from RC4-40 to AES-256, content streams and inline images, the page tree with inherited attributes — and a writer that produces the same bytes twice. Of **118 863 real PDFs**, 118 833 open; the thirty that do not are 27 PNGs named `.pdf`, one PostScript file and two truncated past recovery. **It also writes a LINEARIZED file** since [v0.16.0](https://github.com/go-pdfkit/reader/releases/tag/v0.16.0) — Annex F's eleven parts, both cross-reference sections and a hint stream carrying the page offset and shared object tables — and `qpdf --check` reports nothing about the output it does not also report about the input. Since [v0.18.0](https://github.com/go-pdfkit/reader/releases/tag/v0.18.0) that includes **documents whose pages share objects**, which the page tree's own inheritance makes the ordinary multi-page PDF: one `/Resources` on the pages node is reached by every page, and F.4.2's shared object hint table now says which of part 6's and part 8's objects each page after the first depends on. Measured over eight shapes against qpdf 12.4.2 — private pages, a shared content stream, two and twenty-five pages inheriting one resource dictionary, and pages 2 and 3 sharing an object page 1 never reaches. ⚠ What it still does not say is **where in a page** a shared object is first used: F.4.1's fraction is written 0/1, so a reader may fetch one earlier than it needs it, never later. ⛔ Since [v0.19.0](https://github.com/go-pdfkit/reader/releases/tag/v0.19.0) it also **refuses three bombs of one shape** — a count the file chose, used as a size. An object stream declaring `/N 10000000000000` asked for a 160 TB slice from a 51-byte object and ended the process with a *fatal* out-of-memory, which `recover()` does not catch and `GOMEMLIMIT` does not prevent; a 102-byte file asked for a 932 MiB predictor row; a fax bounded its width only when `/Rows` was present, and `/Rows` is optional. Each ceiling is now derived from bytes actually held rather than from a number the file asserts. **None was found by reading the code** — the object stream and the predictor row came from fuzzing, and the fax from the audit that the object stream's issue asked for, which is why `FuzzCCITTDecode` no longer pins the parameters it is meant to vary. **It reads and verifies digital signatures** since [v0.20.0](https://github.com/go-pdfkit/reader/releases/tag/v0.20.0): `Document.Signatures` lists the signed fields, `Document.SignedBytes` returns the bytes a signature covers after validating its `/ByteRange`, and the `reader/signature` sub-package verifies `adbe.pkcs7.detached` and `ETSI.CAdES.detached` on top of go-authn/cms. It was checked against poppler `pdfsig` 26.10.0 on OpenSSL-made fixtures — RSA, ECDSA and CAdES valid; an incremental update leaves the earlier signature valid, not whole-file; two stacked signatures; seven tamperings refused by both. One deliberate difference: `pdfsig` calls a SHA-1 signature valid and this package refuses it by name. A `/ByteRange` the file does not bear out is refused, and a signer's claimed name, reason, location and time are reported only when the signature covers the dictionary that holds them. At most 64 distinct signatures and 1 GiB of signed bytes are verified per document. ⚠ Trust — the certificate chain and revocation — is the caller's."

[[params.repos]]
  name = "ops"
  pkg = "github.com/go-pdfkit/ops"
  url = "https://github.com/go-pdfkit/ops"
  status = "ready"
  blurb = "**The verbs, and the `pdfops` command** — 61 of them, counted from its own `--help`. Merge, select, delete, reverse, move, rotate, crop, resize, split, n-up, booklet, poster, divide, duplex, overlay, blank pages, watermarks, page numbers, Bates stamps, a **placed picture** — a signature or a logo — page labels, layers, text colour, sanitize, flatten, compress, encrypt, decrypt, permissions, repair, attachments, forms — and reading a page back as text, pictures, **tables** (CSV, JSON or Markdown) or a whole **document** in Markdown. Links and bookmarks are carried over and pointed at the pages they became. **It signs a PDF** since [v0.39.0](https://github.com/go-pdfkit/ops/releases/tag/v0.39.0): `ops.Sign` and `pdfops sign` add a digital signature as an incremental update, so every earlier signature still verifies, with a detached CMS from go-authn/cms — RSA, RSA-PSS, ECDSA or Ed25519 — under `adbe.pkcs7.detached` or `ETSI.CAdES.detached`. poppler `pdfsig` calls the RSA and ECDSA signatures valid; ⚠ it reports an Ed25519 one as Invalid, while `reader/signature` and `openssl cms -verify` accept the same bytes. Since [v0.40.0](https://github.com/go-pdfkit/ops/releases/tag/v0.40.0) the signature can be **visible**: `SignOptions.Appearance` and `pdfops sign -visible x0,y0,x1,y1 [-image file] [-text words]` draw a picture and text in a box on the page, inside the signed bytes. ⛔ The text is Latin only (WinAnsi): a Cyrillic or CJK character is refused by name, not dropped. **It signs with a `.p12` / `.pfx` file** since [v0.41.0](https://github.com/go-pdfkit/ops/releases/tag/v0.41.0): `SignOptions.LoadPKCS12` and `pdfops sign -p12 f.p12 [-p12pass <file or ->]` take the key, certificate and chain from one password-protected PKCS #12 file, the password never an argument or an environment variable. ⛔ The certificate is not judged — no validity dates, key usage or chain to a root are checked. ⛔ Not claimed: a PAdES baseline, timestamps or LTV, or an encrypted file, which is refused. Every verb is measured on the whole corpus: 118 833 files compressed and read back **page for page identical**, 35.2 GB down to 33.6 GB."

[[params.repos]]
  name = "render"
  pkg = "github.com/go-pdfkit/render"
  url = "https://github.com/go-pdfkit/render"
  status = "ready"
  blurb = "**Turns a page into pixels.** The transform stack, every painting operator, both winding rules, strokes with caps/joins/miter/dashes, clipping, every colour space, transparency, form XObjects; images at every depth with soft and stencil masks; text from TrueType, OpenType, **bare CFF**, **PostScript Type 1**, composite and Type 3 fonts; PDF functions of all four kinds, **all seven shadings** — axial, radial, function-based, and the four mesh kinds, triangles and Coons and tensor patches — and shading and tiling patterns, placed in the space of the form that names them. Rasterises with [go-gfx](https://github.com/go-gfx/gfx) and reads outlines with [go-opentype](https://github.com/go-opentype/opentype). Builds for `js/wasm`."

[[params.repos]]
  name = "pdffont"
  pkg = "github.com/go-pdfkit/pdffont"
  url = "https://github.com/go-pdfkit/pdffont"
  status = "ready"
  blurb = "**What a document says about a font** — not the outlines, which are the program's business. Which codes a string holds, how wide each is, what each is called, and what text each stands for, through `/ToUnicode` and the encodings. It refuses one guess: a **symbolic** font read through an assumed encoding gives the wrong letter with nothing to say so. The glyph-name table is checked against the documents themselves — **63 515 names, 99.31% agreement**."

[[params.repos]]
  name = "convert"
  pkg = "github.com/go-pdfkit/convert"
  url = "https://github.com/go-pdfkit/convert"
  status = "ready"
  blurb = "**Pictures into a PDF, and a PDF back into pictures — or into SVG.** Reads PNG, JPEG, GIF, BMP, TIFF, WebP and PSD, and writes all of those but PSD — which it refuses **by name**, because writing a layered document is a different job and a PNG under a `.psd` name would be worse than saying no. **PDF to SVG** (`pdfconv to-svg`, v0.17.0): text becomes outlines so the file needs no font, one page is `name.svg` and several are `name_svg.zip`, and it is **all or nothing** — a zip with page 4 of 9 missing would look complete, so no file is left behind. Bounded before it is spent: 1000 pages, 64 MiB a page, 256 MiB and five minutes a run. ⛔ **Passwords no longer go on the command line**: `-password` is gone from every verb, replaced by `-password-file` (a breaking change). **WebP writes in both of its codecs**: quality 100 is the lossless one, half the size of PNG on a rasterised page of text; below that the lossy one, 12× smaller again on a detailed page. The **content** decides a format, never the file's name. Only the **DPI** says which page a picture is: 2480×3508 is A4 at 300 and a page a metre tall at 72. Fitting onto paper uses **one scale for both axes** and only ever shrinks."

[[params.repos]]
  name = "doc2pdf"
  pkg = "github.com/go-pdfkit/doc2pdf"
  url = "https://github.com/go-pdfkit/doc2pdf"
  status = "ready"
  blurb = "**Any document into a PDF, from a shell.** `doc2pdf report.docx` — Word, Excel, PowerPoint, OpenDocument Text, Markdown, reStructuredText, HTML, plain text, CSV, JSON, XML, EPUB, MOBI, FictionBook, RTF and email, through [richdoc](https://github.com/go-richdoc/richdoc) and `document`; **XPS and OpenXPS** (v0.4.0) are read directly into a vector PDF under one 160 MiB memory budget per conversion ([doc2pdf](https://github.com/go-pdfkit/doc2pdf)). Pure Go, CGO-free, no TeX. `--max-input BYTES` refuses an input over the limit before reading it (16 MiB for RTF, 256 MiB for every other format), and the output is written atomically. It exists because **thirteen libraries were finished, tested, released and unusable from a shell**: measured across thirty repositories of this fleet, four shipped a command and twenty-five did not, and a reader nothing can call is in a different state from an unfinished one — easy to mistake for it. ⛔ **Nothing is fetched.** A document arrives from something somebody was handed and its images carry URLs the *author* chose; following them would make every conversion a request to an address of their choosing, from the converting machine. What was refused is **printed**, because a page with holes in it must not be silent. A failure names the **reader** — thirteen libraries stand behind it and \"cannot read it\" sends you to the wrong one — and every reader in the table is held by a test that converts a real file of that format."

[[params.repos]]
  name = "extract"
  pkg = "github.com/go-pdfkit/extract"
  url = "https://github.com/go-pdfkit/extract"
  status = "ready"
  blurb = "**Reads a page back**: the text with where each piece of it sits, the pictures with the box each covers, and the **grids its text lines up into**. A page holds instructions for drawing glyphs, not text — so where the document says nothing about what they mean, this **says so** rather than guessing. A column boundary is a stretch of page every row leaves empty, and three things that look like columns are not: a bullet, a column nothing was drawn in, and a page number. On one 213-page document those three took the count from 588 tables to **40**, which are the real ones; a prose report in the same run reports none. Over the whole corpus: 121 946 pages, 34 million characters, 1.89% of runs that nothing in the document could name, 300 685 pictures located, no panics."

[[params.repos]]
  name = "document"
  pkg = "github.com/go-pdfkit/document"
  url = "https://github.com/go-pdfkit/document"
  status = "ready"
  blurb = "**A PDF read back as a document rather than as text** — headings, paragraphs, lists and tables, into the [richdoc](https://github.com/go-richdoc/richdoc) model, which gets Markdown, reST and HTML out of a PDF through code the fleet already has. A page has no headings: it has glyphs at places, and everything above that is an **inference**. A heading is text set larger than the body *and* rare with it — measured over six real documents, heading sizes hold 0.01% to 5.76% of the characters and a second body size holds a third, and taking \"larger\" alone gave a nine-page report 131 headings of which 130 were prose. What it will not read is published too: ruled lines, columns of a multi-column layout, and footnotes."

[[params.repos]]
  name = "coedit"
  pkg = "github.com/go-pdfkit/coedit"
  url = "https://github.com/go-pdfkit/coedit"
  status = "ready"
  blurb = "**A PDF several people edit at once.** What is shared is not the file — merging two piles of bytes cannot be done — but the *plan*: which pages, from which files, in which order, turned and cropped how, with which bookmarks over them. A list, a tree and a handful of fields, which a [CRDT](https://github.com/go-crdt/crdt) merges without asking anybody. Checked with **25 editors making random edits for 40 rounds**, merged in a random order, all agreeing on the same document."

[[params.repos]]
  name = "forms"
  pkg = "github.com/go-pdfkit/forms"
  url = "https://github.com/go-pdfkit/forms"
  status = "ready"
  blurb = "**Read, fill and draw an AcroForm** — the boxes somebody types into, the squares they tick, the lists they choose from. A field's value is not what gets drawn: what gets drawn is a little content stream beside it, so a reader that fills a field and does not rewrite that stream leaves the page blank. An AcroForm dictionary with an empty field list is not a form — **561** of the 118 833 figure-corpus files are exactly that, left behind by a producer. Builds for `js/wasm`."

[[params.repos]]
  name = "xfa"
  pkg = "github.com/go-pdfkit/xfa"
  url = "https://github.com/go-pdfkit/xfa"
  status = "ready"
  blurb = "**The form inside a PDF whose pages are blank.** Of **2 240** real government forms, 560 carry an XFA package and **546 are static** — a second, proprietary copy of a form already drawn on the pages, which `forms` fills without help. The other **fourteen** are dynamic: their pages hold a panel reading *Please wait... your PDF viewer may not be able to display this type of document*, and the document exists only as XML. Adobe removed the format from PDF 2.0, and no browser lays one out."

[[params.repos]]
  name = "html2pdf"
  pkg = "github.com/go-pdfkit/html2pdf"
  url = "https://github.com/go-pdfkit/html2pdf"
  status = "ready"
  blurb = "**Static HTML to VECTOR PDF**, zero C. No headless browser and no screenshot-then-slice: it drives go-webengine's own layout tree straight into `pdfkit`'s text, rect and stroke calls, so the text in the PDF is real text — selectable, searchable, small — rather than a picture of text. **v0.4.0**: `Options.Fetch` and `html2pdf.Offline` render with no network access at all (a refused stylesheet or image is left out, counted through `OnRefused`; `data:` images still render; `--offline` on the command), a second barrier for a server that renders HTML built from untrusted text. **v0.3.0**: list markers painted (`::marker`, every `list-style-type`), CSS escapes and counters; `@page` margin boxes with `counter(page)` / `counter(pages)` for page numbers, `target-counter()` for a table of contents, and a `html2pdf` command (cobra, POSIX flags, `--title`, `--author`, `--subject`, `--keywords`)."

[[params.repos]]
  name = "latex"
  pkg = "github.com/go-pdfkit/latex"
  url = "https://github.com/go-pdfkit/latex"
  status = "ready"
  blurb = "**The other direction: reconstruct LaTeX source from a PDF.** A PDF that came from TeX does not contain a document; it contains the marks TeX made putting one on paper — glyphs at absolute positions, from fonts whose names are the only surviving record of what the author asked for. `Reconstruct` gives back the `.tex`, and writes out the pictures its includegraphics commands name."

[[params.repos]]
  name = "conformance"
  pkg = "github.com/go-pdfkit/conformance"
  url = "https://github.com/go-pdfkit/conformance"
  status = "ready"
  blurb = "**Where all of the above is judged by implementations that are not ours**, over corpora of real PDFs. A file our own reader reads back perfectly can draw nothing anywhere else — that has happened here: a rebuilt cross-reference stream our reader was delighted with, and macOS drew a blank page. So these tools ask poppler rather than asking ourselves. A figure is only as honest as the population it came from, so the corpora are chosen and stated rather than collected."

[[params.repos]]
  name = "playground"
  pkg = "github.com/go-pdfkit/playground"
  url = "https://github.com/go-pdfkit/playground"
  status = "ready"
  blurb = "**A PDF workbench that runs in a browser tab and nowhere else.** Open a file, turn its pages, rotate one, drop one, lay it out two to a sheet, write across it, save it back out — and none of it leaves the machine, because there is nowhere for it to go. Its commands are a ribbon of seven tabs: the ribbon carries the verbs and a panel beside the page carries what each verb is told, so choosing a tab opens the settings that tab's verbs read. Down the left, a rail you can widen: the document's own table of contents above its minipages, and **the links it carries** when it has no outline — which most documents do not, so a contents view offered only to the minority is one nobody finds. Each link's row says the words it sits on, which is the only name a link has; one that leaves the document is shown and **not followed**, because nothing leaves this tab and that includes you. The status line names the **build** it is running, because an old binary and a missing feature are otherwise the same screen. Widen the rail and the minipages are **re-rendered** at their new width when you let go. The whole tool is one wasm binary the browser downloads once and a service worker then keeps. Driven in CI by a real Chrome over the DevTools protocol, pressing each control where the workbench says it is, **dragging the divider the way a hand does** — press, move while held, let go — and reading the canvas pixels back. That last part is new, and it found two defects on its first run: everything the check did before was a press, and a press is one point, so the one control that answers only to a gesture had never been exercised at all."

[[params.repos]]
  name = "pdfkit"
  pkg = "github.com/go-pdfkit/pdfkit"
  url = "https://github.com/go-pdfkit/pdfkit"
  status = "ready"
  blurb = "**The document builder**: pages, vector graphics, and text set in embedded, subsetted fonts. TrueType and OpenType/CFF embed as **Type0 (Identity-H)** composite fonts with a `/ToUnicode` CMap; JPEG and raster images place directly; a **widget bridge** prints a [go-widgets](https://github.com/go-widgets/toolkit) tree onto a page, rasterised or as selectable vector text. With the zero `Options` the output has no timestamps and a content-derived `/ID`, so identical inputs produce byte-identical PDFs."

[[params.repos]]
  name = "bentogap"
  pkg = "github.com/go-pdfkit/bentogap"
  url = "https://github.com/go-pdfkit/bentogap"
  status = "ready"
  blurb = "**The gap against BentoPDF, counted row by row** and reported with its denominator."

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-pdfkit.github.io/docs/"
  label = "Read the documentation"
[[params.cta]]
  kind  = "try"
  href  = "https://go-pdfkit.github.io/playground/"
  label = "Edit a PDF in your browser →"
