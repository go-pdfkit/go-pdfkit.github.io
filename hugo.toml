baseURL = "https://go-pdfkit.github.io/"
title = "go-pdfkit"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

[[params.repos]]
  name = "reader"
  pkg = "github.com/go-pdfkit/reader"
  url = "https://github.com/go-pdfkit/reader"
  status = "ready"
  blurb = "**Reads and writes the format itself.** Lexer and object model, cross-reference tables *and* streams with hybrid files and `/Prev` chains, object streams, repair by scanning when the table is wrong, every filter (Flate, LZW with early change, ASCIIHex, ASCII85, RunLength, PNG and TIFF predictors), the standard security handler from RC4-40 to AES-256, content streams and inline images, the page tree with inherited attributes — and a writer that produces the same bytes twice. Of **118 863 real PDFs**, 118 833 open; the thirty that do not are 27 PNGs named `.pdf`, one PostScript file and two truncated past recovery."

[[params.repos]]
  name = "ops"
  pkg = "github.com/go-pdfkit/ops"
  url = "https://github.com/go-pdfkit/ops"
  status = "ready"
  blurb = "**The verbs, and the `pdfops` command.** Merge, select, delete, reverse, move, rotate, crop, resize, split, n-up, booklet, overlay, blank pages, watermarks, page numbers, Bates stamps, sanitize, flatten, compress, encrypt, decrypt, permissions, and reading a page back as text or pictures. Links and bookmarks are carried over and pointed at the pages they became. Every verb is measured on the whole corpus: 118 833 files compressed and read back **page for page identical**, 35.2 GB down to 33.6 GB."

[[params.repos]]
  name = "render"
  pkg = "github.com/go-pdfkit/render"
  url = "https://github.com/go-pdfkit/render"
  status = "ready"
  blurb = "**Turns a page into pixels.** The transform stack, every painting operator, both winding rules, strokes with caps/joins/miter/dashes, clipping, every colour space, transparency, form XObjects; images at every depth with soft and stencil masks; text from TrueType, OpenType, **bare CFF**, **PostScript Type 1**, composite and Type 3 fonts; PDF functions of all four kinds, **all seven shadings** — axial, radial, function-based, and the four mesh kinds, triangles and Coons and tensor patches — and shading and tiling patterns, placed in the space of the form that names them. Rasterises with [go-gfx](https://github.com/go-gfx/gfx) and reads outlines with [go-opentype](https://github.com/go-opentype/opentype). Builds for `js/wasm`."

[[params.repos]]
  name = "pdffont"
  pkg = "github.com/go-pdfkit/pdffont"
  url = "https://github.com/go-pdfkit/pdffont"
  status = "ready"
  blurb = "**What a document says about a font** — not the outlines, which are the program's business. Which codes a string holds, how wide each is, what each is called, and what text each stands for, through `/ToUnicode` and the encodings. It refuses one guess: a **symbolic** font read through an assumed encoding gives the wrong letter with nothing to say so. The glyph-name table is checked against the documents themselves — **63 515 names, 99.31% agreement**."

[[params.repos]]
  name = "extract"
  pkg = "github.com/go-pdfkit/extract"
  url = "https://github.com/go-pdfkit/extract"
  status = "ready"
  blurb = "**Reads a page back**: the text with where each piece of it sits, and the pictures with the box each covers. A page holds instructions for drawing glyphs, not text — so where the document says nothing about what they mean, this **says so** rather than guessing. Over the whole corpus: 121 946 pages, 34 million characters, 1.89% of runs that nothing in the document could name, 300 685 pictures located, no panics."

[[params.repos]]
  name = "coedit"
  pkg = "github.com/go-pdfkit/coedit"
  url = "https://github.com/go-pdfkit/coedit"
  status = "ready"
  blurb = "**A PDF several people edit at once.** What is shared is not the file — merging two piles of bytes cannot be done — but the *plan*: which pages, from which files, in which order, turned and cropped how, with which bookmarks over them. A list, a tree and a handful of fields, which a [CRDT](https://github.com/go-crdt/crdt) merges without asking anybody. Checked with **25 editors making random edits for 40 rounds**, merged in a random order, all agreeing on the same document."

[[params.repos]]
  name = "forms"
  pkg = "github.com/go-pdfkit/forms"
  url = "https://github.com/go-pdfkit/forms"
  status = "ready"
  blurb = "**Read, fill and draw an AcroForm** — the boxes somebody types into, the squares they tick, the lists they choose from. A field's value is not what gets drawn: what gets drawn is a little content stream beside it, so a reader that fills a field and does not rewrite that stream leaves the page blank. An AcroForm dictionary with an empty field list is not a form — **561** of the 118 833 figure-corpus files are exactly that, left behind by a producer. Builds for `js/wasm`."

[[params.repos]]
  name = "xfa"
  pkg = "github.com/go-pdfkit/xfa"
  url = "https://github.com/go-pdfkit/xfa"
  status = "ready"
  blurb = "**The form inside a PDF whose pages are blank.** Of **2 240** real government forms, 560 carry an XFA package and **546 are static** — a second, proprietary copy of a form already drawn on the pages, which `forms` fills without help. The other **fourteen** are dynamic: their pages hold a panel reading *Please wait... your PDF viewer may not be able to display this type of document*, and the document exists only as XML. Adobe removed the format from PDF 2.0, and no browser lays one out."

[[params.repos]]
  name = "html2pdf"
  pkg = "github.com/go-pdfkit/html2pdf"
  url = "https://github.com/go-pdfkit/html2pdf"
  status = "ready"
  blurb = "**Static HTML to VECTOR PDF**, zero C. No headless browser and no screenshot-then-slice: it drives go-webengine's own layout tree straight into `pdfkit`'s text, rect and stroke calls, so the text in the PDF is real text — selectable, searchable, small — rather than a picture of text."

[[params.repos]]
  name = "latex"
  pkg = "github.com/go-pdfkit/latex"
  url = "https://github.com/go-pdfkit/latex"
  status = "ready"
  blurb = "**The other direction: reconstruct LaTeX source from a PDF.** A PDF that came from TeX does not contain a document; it contains the marks TeX made putting one on paper — glyphs at absolute positions, from fonts whose names are the only surviving record of what the author asked for. `Reconstruct` gives back the `.tex`, and writes out the pictures its includegraphics commands name."

[[params.repos]]
  name = "conformance"
  pkg = "github.com/go-pdfkit/conformance"
  url = "https://github.com/go-pdfkit/conformance"
  status = "ready"
  blurb = "**Where all of the above is judged by implementations that are not ours**, over corpora of real PDFs. A file our own reader reads back perfectly can draw nothing anywhere else — that has happened here: a rebuilt cross-reference stream our reader was delighted with, and macOS drew a blank page. So these tools ask poppler rather than asking ourselves. A figure is only as honest as the population it came from, so the corpora are chosen and stated rather than collected."

[[params.repos]]
  name = "app"
  pkg = "github.com/go-pdfkit/app"
  url = "https://github.com/go-pdfkit/app"
  status = "ready"
  blurb = "**A PDF workbench that runs in a browser tab and nowhere else.** Open a file, turn its pages, rotate one, drop one, lay it out two to a sheet, write across it, save it back out — and none of it leaves the machine, because there is nowhere for it to go. The whole tool is one wasm binary the browser downloads once and a service worker then keeps. Driven in CI by a real Chrome over the DevTools protocol, reading the canvas pixels back."

[[params.repos]]
  name = "pdfkit"
  pkg = "github.com/go-pdfkit/pdfkit"
  url = "https://github.com/go-pdfkit/pdfkit"
  status = "ready"
  blurb = "**The document builder**: pages, vector graphics, and text set in embedded, subsetted fonts. TrueType and OpenType/CFF embed as **Type0 (Identity-H)** composite fonts with a `/ToUnicode` CMap; JPEG and raster images place directly; a **widget bridge** prints a [go-widgets](https://github.com/go-widgets/toolkit) tree onto a page, rasterised or as selectable vector text. With the zero `Options` the output has no timestamps and a content-derived `/ID`, so identical inputs produce byte-identical PDFs."
