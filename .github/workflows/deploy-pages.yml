name: deploy-pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content,
  # the Hugo version or one of the actions below has to prove the site still
  # builds before it lands. Without this the workflow ran only on main, so a
  # dependency bump arrived with no signal at all: its checks read "no checks",
  # which is not the same thing as green and must not be merged as if it were.
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served even
# if a step in it misbehaves.
permissions:
  contents: read
  pages: read

# Deploys serialise with one another under the main group. A pull request gets
# a group of its own, so it neither waits behind a deploy nor holds one up, and
# a new push to the same pull request supersedes the build still running for it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # ⛔ THERE IS NO WASM TO BUILD HERE ANY MORE. This repository carried a
      # second PDF editor — its own ribbon, its own thumbnails, its own
      # dialogs — published at /playground/ beside the workbench at /app/. The
      # hero's own comment had already said what that cost: "There were briefly
      # two of these side by side — the app and the playground — which only
      # made each of them the other's worse version."
      #
      # It was the worse version by the time it went: no icons on any of its
      # controls (its toolkit.Action was built with no Icon field at all, and
      # its tooltips were discarded with `_ = tip`), and a page off by one when
      # a reader pressed a minipage. Both were reported by somebody using it.
      # The workbench has neither, and has a browser check at two pixel ratios
      # that would have caught them.
      #
      # The editor is now one implementation, in go-pdfkit/playground, served
      # at /playground/ as every other org in the fleet serves its own —
      # go-filesystems/playground, go-notebook/playground,
      # go-wasmcontainers/playground.
      - name: Build landing page
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    # Only main publishes. A pull request stops after the build above: it has
    # proved the site builds, which is the whole point of the gate, and it has
    # no business replacing the published site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
