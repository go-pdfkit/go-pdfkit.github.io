# Does the playground still work?
#
# ⛔ THE PAGE IS THE ARTEFACT, NOT THE PACKAGE. `go test` proves the editor's
# commands are right; it says nothing about whether the page loads the module,
# finds its globals and draws anything. Those have failed independently of the
# Go code before — a stale wasm_exec.js, a global set before the function that
# reads it, a .wasm served as octet-stream — and each of them leaves every Go
# test green.
#
# So this drives a real browser at the built site and reads the DOM back.
name: playground

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: the editor builds and its commands pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: playground/go.mod
      - name: Vet
        working-directory: playground
        run: go vet ./...
      # ⛔ Vetted for js/wasm as well as for the host. The command that
      # actually ships is the one behind `//go:build js && wasm`, and a host
      # vet never compiles it.
      - name: Vet for js/wasm
        working-directory: playground
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./...
      - name: Test
        working-directory: playground
        run: go test -race ./...
      - name: Build and weigh the module
        working-directory: playground
        run: go run ./cmd/build

  page:
    name: a real browser draws the ribbon and a page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: playground/go.mod
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Build the playground (wasm)
        working-directory: playground
        run: go run ./cmd/build

      - name: Build the site
        run: hugo --minify

      # ⛔ AT BOTH PIXEL RATIOS. Headless Chrome runs at 1 unless told
      # otherwise, so for as long as this ran once it could only ever see the
      # display nobody has a problem with. The editor came up unreadable on
      # every Retina screen — the bands were raw numbers while every widget
      # was drawn twice as large — and this check was green throughout.
      - name: Drive it on an ordinary display
        working-directory: playground
        run: go run ./cmd/pagecheck -dir ../public -dpr 1 -chrome "$(which google-chrome || which chromium-browser || which chromium)"

      - name: Drive it on a Retina display
        working-directory: playground
        run: go run ./cmd/pagecheck -dir ../public -dpr 2 -chrome "$(which google-chrome || which chromium-browser || which chromium)"

      # ⛔ THE THEME IS A THING THAT CHANGES, so it needs a check that changes
      # it. pagecheck above photographs the page once, which cannot see whether
      # the canvas FOLLOWS the reader's toggle or the machine turning dark at
      # sunset — both of which it did not, until the listeners went in. This one
      # speaks the DevTools protocol, because no command-line flag says "the
      # machine is in dark mode" and the page resolves "system" through exactly
      # that media feature.
      - name: It follows the system setting and the reader's toggle
        working-directory: playground
        run: go run ./cmd/themecheck -dir ../public -chrome "$(which google-chrome || which chromium-browser || which chromium)"
